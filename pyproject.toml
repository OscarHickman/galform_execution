[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galform_execution"
version = "0.3.0"
description = "Generate and submit GALFORM semi-analytic galaxy formation runs on N-body merger trees to SLURM (COSMA HPC)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oscar Hickman" }]
keywords = [
	"astronomy",
	"cosmology",
	"galaxy formation",
	"semi-analytic model",
	"galform",
	"n-body",
	"slurm",
	"hpc",
	"cosma",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Console",
	"Intended Audience :: Science/Research",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering :: Astronomy",
	"Topic :: Scientific/Engineering :: Physics",
	"Topic :: System :: Distributed Computing",
	"Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/OscarHickman/galform_execution"
Repository = "https://github.com/OscarHickman/galform_execution"
Issues = "https://github.com/OscarHickman/galform_execution/issues"
Changelog = "https://github.com/OscarHickman/galform_execution/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.20797781"

[project.scripts]
submit-galform-job = "galform_execution.cli:main"

[dependency-groups]
dev = [
	"pytest>=7",
	"pytest-cov>=4",
	"ruff>=0.4,<1",
	"black>=24.0,<26",
	"isort>=5.12",
	"mypy>=1",
	"twine>=5",
]

[tool.setuptools]
packages = ["galform_execution"]
include-package-data = true

[tool.setuptools.package-data]
galform_execution = ["py.typed", "config/**/*.json", "config/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["galform_execution"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

[tool.isort]
profile = "black"

[tool.ruff.lint]
# Pin the rule set explicitly. Without this, ruff's "no config" default
# selection changes between ruff releases (e.g. 0.15 -> 0.16 started
# enabling rules like FA100/BLE001), which broke CI even though nothing
# in this codebase changed. E4/E7/E9/F match ruff's long-standing
# original defaults (pyflakes + a handful of pycodestyle error checks).
select = ["E4", "E7", "E9", "F"]
