[project]
name = "galform_execution"
version = "0.2.2"
description = "GALFORM execution helper utilities"
readme = "README.md"
requires-python = ">=3.8"
authors = [ { name = "Oscar Hickman" } ]
dependencies = []
license = { text = "MIT" }
keywords = ["astronomy", "galform", "slurm", "submission"]
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: MIT License",
	"Operating System :: POSIX :: Linux",
]
urls = { "Homepage" = "https://github.com/OscarHickman/galform_execution" }

[project.scripts]
submit-galform-job = "galform_execution.submit_galform_job:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["galform_execution"]
include-package-data = true

[tool.setuptools.package-data]
galform_execution = ["config/**/*.json", "config/**/*.txt"]

[tool.isort]
profile = "black"

[tool.ruff.lint]
# Pin the rule set explicitly. Without this, ruff's "no config" default
# selection changes between ruff releases (e.g. 0.15 -> 0.16 started
# enabling rules like FA100/BLE001), which broke CI even though nothing
# in this codebase changed. E4/E7/E9/F match ruff's long-standing
# original defaults (pyflakes + a handful of pycodestyle error checks).
select = ["E4", "E7", "E9", "F"]

